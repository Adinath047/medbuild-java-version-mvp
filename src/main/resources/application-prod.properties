# ===================================================================================
#  MEDICOS — PRODUCTION PROFILE OVERRIDES
#  Activate with: --spring.profiles.active=prod
#  Or set env var: SPRING_PROFILES_ACTIVE=prod
# ===================================================================================

# Safe auto-update schema in production with environment override
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Run safe IF NOT EXISTS schema initialization on boot
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:always}
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

# Use real Redis in prod — never the embedded fallback
spring.embedded.redis.enabled=false

# Shorter JWT Access Token TTL in prod: 15 minutes (900,000 ms)
jwt.expiration-ms=900000
jwt.refresh-expiration-ms=604800000
jwt.cookie-secure=true

# Lower Form POST size ceiling to limit memory-mapping attacks
server.tomcat.max-http-form-post-size=256KB

# Disable Swagger in production — API docs are an attacker's map
swagger.enabled=false
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Stricter HikariCP pool in prod
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=5

# Suppress SQL logs in prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enforce HTTPS redirect behind a TLS terminator (Cloud Run / nginx)
server.forward-headers-strategy=NATIVE

# Enforce rate limiting in production environment
rate-limiting.enabled=true
