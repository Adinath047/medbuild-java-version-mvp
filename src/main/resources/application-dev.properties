# ===================================================================================
#  MEDICOS EMR — LOCAL DEV PROFILE OVERRIDES
#  Activated with: --spring.profiles.active=dev  (or SPRING_PROFILES_ACTIVE=dev)
#
#  These settings are intentionally UNSAFE for production. They exist only so a
#  developer can spin up a fresh local database without running migrations manually.
# ===================================================================================

# In dev: Hibernate alters tables automatically to match entity changes
spring.jpa.hibernate.ddl-auto=update

# In dev: schema.sql runs on every boot — creates tables + seeds initial data if missing
spring.sql.init.mode=always

# Show SQL in dev console for debugging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
