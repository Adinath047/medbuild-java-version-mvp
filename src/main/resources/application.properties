# =====================================================================
#  MEDICOS HOSPITAL EMR — SPRING BOOT JAVA BACKEND CONFIGURATION
# =====================================================================

server.port=${PORT:8080}
spring.application.name=medbuild

# =====================================================================
# 🛠️ LOCAL POSTGRESQL DATABASE CONFIGURATION
# =====================================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medicos_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HIKARICP CONNECTION POOL OPTIMIZATION
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MedicosHikariCP

# ── JPA / HIBERNATE CONFIGURATION ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true




# ── SWAGGER / OPENAPI UI CONFIGURATION ───────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ── SECURITY & JWT SETTINGS ───────────────────────────────────────────
jwt.secret=${JWT_SECRET:MedicosSecretKeySuperSecureJwtTokenSignatureKey2026WithAtLeast256BitsSecretKey!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
superadmin.secret=${SUPER_ADMIN_SECRET:medicos-superadmin-secret-key-2026}

# ── CORS ALLOWED ORIGINS ──────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4000,http://127.0.0.1:5173,http://127.0.0.1:3000}
