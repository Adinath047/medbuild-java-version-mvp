# =====================================================================
#  MEDICOS HOSPITAL EMR — SPRING BOOT JAVA BACKEND CONFIGURATION
# =====================================================================

server.port=${PORT:8080}
spring.application.name=medbuild

# =====================================================================
# 🛠️ GOOGLE CLOUD SQL CONFIGURATION VARIABLES
# =====================================================================

# 1. Your Google Cloud SQL Public IP (e.g. 34.123.45.67)
gcp.cloudsql.ip=${GCP_CLOUD_SQL_IP:localhost}

# 2. Your Database Name (default: medicos_db)
gcp.cloudsql.dbname=${GCP_DB_NAME:medicos_db}

# 3. Your Database Username (default: postgres)
gcp.cloudsql.username=${GCP_DB_USERNAME:postgres}

# 4. Your Database Password
gcp.cloudsql.password=${GCP_DB_PASSWORD:postgres}

# ── ACTIVE SPRING DATASOURCE CONFIGURATION ───────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${gcp.cloudsql.ip}:5432/${gcp.cloudsql.dbname}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${gcp.cloudsql.username}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${gcp.cloudsql.password}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HIKARICP CONNECTION POOL OPTIMIZATION (ALLOW FAST PORT 8080 BINDING)
# Setting initialization-fail-timeout=-1 ensures container starts on PORT 8080 immediately
# even if DB network connection is slow or Cloud SQL connection is establishing
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=MedicosHikariCP

# ── JPA / HIBERNATE CONFIGURATION ─────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ── SWAGGER / OPENAPI UI CONFIGURATION ───────────────────────────────
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.api-docs.path=/v3/api-docs

# ── SECURITY & JWT SETTINGS ───────────────────────────────────────────
jwt.secret=${JWT_SECRET:MedicosSecretKeySuperSecureJwtTokenSignatureKey2026WithAtLeast256BitsSecretKey!}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
superadmin.secret=${SUPER_ADMIN_SECRET:medicos-superadmin-secret-key-2026}

# ── CORS ALLOWED ORIGINS ──────────────────────────────────────────────
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4000,http://127.0.0.1:5173,http://127.0.0.1:3000}
