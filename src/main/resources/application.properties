# ===================================================================================
#  MEDICOS HOSPITAL EMR — SPRING BOOT BACKEND CONFIGURATION
# ===================================================================================
#  This file configures core server settings, relational database connectivity, 
#  HikariCP pooling, JPA/Hibernate ORM behavior, Spring ACID transaction parameters,
#  Redis caching, Security/JWT settings, Swagger API docs, and CORS policies.
# ===================================================================================

# -----------------------------------------------------------------------------------
# 1. SERVER & APPLICATION IDENTIFICATION
# -----------------------------------------------------------------------------------
# Defines the HTTP server port (defaults to 8080 or the PORT environment variable)
server.port=${PORT:8080}

# Application name identifier registered in Spring ApplicationContext
spring.application.name=medbuild


# -----------------------------------------------------------------------------------
# 2. RELATIONAL DATABASE (POSTGRESQL) & ACID DATASOURCE CONFIGURATION
# -----------------------------------------------------------------------------------
# Connection URL for PostgreSQL relational database ensuring ACID-compliant persistent storage
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/medbuild_java_mvp}

# Master Database Username for authentication
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}

# Master Database Password for authentication
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# Fully qualified class name of the PostgreSQL JDBC Driver
spring.datasource.driver-class-name=org.postgresql.Driver


# -----------------------------------------------------------------------------------
# 3. HIKARICP CONNECTION POOL OPTIMIZATION (ACID ISOLATION & DURABILITY)
# -----------------------------------------------------------------------------------
# Prevents application crash on startup if database pool initialization is delayed (-1 disables fail-fast)
spring.datasource.hikari.initialization-fail-timeout=-1

# Maximum number of active connections in the pool to enforce concurrency control & prevent deadlock
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL:20}

# Minimum number of idle connections maintained in the pool for immediate readiness
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}

# Maximum lifetime (in ms) of an idle connection before it is retired (30 seconds)
spring.datasource.hikari.idle-timeout=30000

# Maximum wait time (in ms) for a client to obtain a connection from the pool (10 seconds)
spring.datasource.hikari.connection-timeout=10000

# Maximum lifetime (in ms) of a connection in the pool (30 minutes)
spring.datasource.hikari.max-lifetime=1800000

# Custom pool name for JMX monitoring and thread debugging
spring.datasource.hikari.pool-name=MedicosHikariCP


# -----------------------------------------------------------------------------------
# 4. JPA / HIBERNATE ORM & ACID TRANSACTION MANAGEMENT
# -----------------------------------------------------------------------------------
# Automatic DDL schema update strategy (updates database tables dynamically on entity change)
spring.jpa.hibernate.ddl-auto=update

# Enables/disables logging of executed SQL statements to the system console (disabled for production clean logging)
spring.jpa.show-sql=false

# Specifies the target SQL dialect for PostgreSQL schema generation and query optimization
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Prevents formatting SQL strings in console logs to optimize memory and log size
spring.jpa.properties.hibernate.format_sql=false

# Defers database script initialization until after JPA EntityManagerFactory initialization
spring.jpa.defer-datasource-initialization=true

# Ensures SQL schema initialization runs always (schema.sql / data.sql)
spring.sql.init.mode=always

# Continues execution if SQL init scripts encounter non-fatal errors (e.g. table already exists)
spring.sql.init.continue-on-error=true

# PRODUCTION OVERRIDE: set SPRING_SQL_INIT_MODE=never in prod to prevent re-seeding on each boot
# PRODUCTION OVERRIDE: set SPRING_JPA_DDL_AUTO=validate in prod to prevent accidental schema changes

# Enables Spring's declarative transaction management to guarantee ACID compliance:
# - Atomicity: Full rollback of service operations on unhandled exceptions
# - Consistency: Database constraint enforcement across entity modifications
# - Isolation: Transactional boundaries with read-only lock optimization
# - Durability: Immediate transaction commit to PostgreSQL storage engine
spring.transaction.default-timeout=30
spring.transaction.rollback-on-commit-failure=true

# Disables lazy-loading during view rendering — prevents N+1 queries leaking through serialization
spring.jpa.open-in-view=false


# -----------------------------------------------------------------------------------
# 5. REDIS IN-MEMORY CACHE & SESSION CONFIGURATION
# -----------------------------------------------------------------------------------
# Specifies Redis as the primary Spring Cache abstraction provider
spring.cache.type=${SPRING_CACHE_TYPE:redis}

# Redis Server Host address
spring.data.redis.host=${REDIS_HOST:localhost}

# Redis Server Port
spring.data.redis.port=${REDIS_PORT:6379}

# Redis Password (optional authentication)
spring.data.redis.password=${REDIS_PASSWORD:}

# Command execution timeout for Redis socket operations (in ms)
spring.data.redis.timeout=2000

# Connection establishment timeout for Redis socket operations (in ms)
spring.data.redis.connect-timeout=2000

# Cache entry Time-To-Live (TTL) duration in milliseconds (10 minutes)
spring.cache.redis.time-to-live=600000

# Prevents caching of null values to keep Redis storage clean and avoid cache pollution
spring.cache.redis.cache-null-values=false

# Enables fallback embedded Redis server when standalone Redis server is unreachable
spring.embedded.redis.enabled=${EMBEDDED_REDIS_ENABLED:true}


# -----------------------------------------------------------------------------------
# 6. SWAGGER / OPENAPI 3 UI DOCUMENTATION CONFIGURATION
# -----------------------------------------------------------------------------------
# Path for interactive Swagger UI web console
springdoc.swagger-ui.path=/swagger-ui.html

# Sorts endpoints in Swagger UI by HTTP method (GET, POST, PUT, DELETE)
springdoc.swagger-ui.operationsSorter=method

# Sorts API tags alphabetically in Swagger UI
springdoc.swagger-ui.tagsSorter=alpha

# OpenAPI v3 JSON spec documentation endpoint path
springdoc.api-docs.path=/v3/api-docs


# -----------------------------------------------------------------------------------
# 7. SECURITY, JWT AUTHENTICATION & SUPERADMIN CREDENTIALS
# -----------------------------------------------------------------------------------
# Secret key used for signing and verifying HMAC-SHA256 JWT access tokens
jwt.secret=${JWT_SECRET:MedicosSecretKeySuperSecureJwtTokenSignatureKey2026WithAtLeast256BitsSecretKey!}

# JWT Token expiration time in milliseconds (86,400,000 ms = 24 hours)
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Secret key required to unlock the Super Admin emergency management console
# CRITICAL: set SUPER_ADMIN_SECRET env var in production — never use the default
superadmin.secret=${SUPER_ADMIN_SECRET:medicos-superadmin-secret-2026}


# -----------------------------------------------------------------------------------
# 8. CROSS-ORIGIN RESOURCE SHARING (CORS) POLICY
# -----------------------------------------------------------------------------------
# Allowed origins permitted to make cross-domain API requests to this backend
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:4000,http://127.0.0.1:5173,http://127.0.0.1:3000,http://10.0.2.2:8080,http://10.0.2.2:3000,http://10.0.2.2:4000,http://10.0.2.2:5173}

# -----------------------------------------------------------------------------------
# 9. PRODUCTION SAFETY SETTINGS
# -----------------------------------------------------------------------------------
# Disable H2 in-memory console — NEVER expose in production (full DB access with no auth)
spring.h2.console.enabled=false

# Maximum allowed request body size to prevent DoS via large payloads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-http-form-post-size=2MB

# Swagger visibility flag — set SWAGGER_ENABLED=false in production
swagger.enabled=${SWAGGER_ENABLED:true}

# Rate limiting toggle - disabled by default in development
rate-limiting.enabled=false

