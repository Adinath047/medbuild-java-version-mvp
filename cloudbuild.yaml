steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/medbuild-java-version-mvp:$COMMIT_SHA', '-t', 'gcr.io/$PROJECT_ID/medbuild-java-version-mvp:latest', '.']

  # Step 2: Push the Docker image to Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/medbuild-java-version-mvp:latest']

  # Step 3: Deploy container to Google Cloud Run
  # APP_FRONTEND_URL is baked here so every invite email link points to the live service.
  # Do NOT set app.medbuilds.com here until DNS is confirmed pointed at Cloud Run.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'medbuild-java-version-mvp'
      - '--image=gcr.io/$PROJECT_ID/medbuild-java-version-mvp:latest'
      - '--region=asia-south1'
      - '--platform=managed'
      - '--port=8080'
      - '--memory=1Gi'
      - '--allow-unauthenticated'
      - '--update-env-vars=APP_FRONTEND_URL=https://medbuild-java-version-mvp-614571130325.asia-south1.run.app'

images:
  - 'gcr.io/$PROJECT_ID/medbuild-java-version-mvp:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/medbuild-java-version-mvp:latest'
