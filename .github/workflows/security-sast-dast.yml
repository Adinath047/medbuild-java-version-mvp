name: Healthcare Security SAST & DAST Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  sast-scan:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Snyk Open Source & Dependency Scan
        uses: snyk/actions/maven@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      - name: Initialize CodeQL (SAST)
        uses: github/codeql-action/init@v3
        with:
          languages: 'java, javascript'
          build-mode: 'manual'

      - name: Build Java Application for CodeQL Tracing
        run: |
          mvn clean compile -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  dast-scan:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build & Launch Docker Container
        run: |
          docker build -t medicos-backend:latest .
          docker run -d --name app-under-test -p 8080:8080 medicos-backend:latest
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/health; then
              echo "Backend is healthy and ready!"
              break
            fi
            echo "Waiting for backend server on port 8080..."
            sleep 2
          done

      - name: Run OWASP ZAP DAST Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080/api/health'
          rules_file_name: '.zap/rules.tsv'
          allow_issue_writing: false
          fail_action: false
          cmd_options: '-a'
