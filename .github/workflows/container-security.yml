name: Container Security Scan (Trivy + OWASP SCA)

on:
  push:
    branches: [ main, master, "feature/**", "fix/**", "security/**" ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly scan every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: OWASP Dependency Check - Software Composition Analysis (SCA)
  #
  # Governance Gate:
  #   Pre-validates .github/owasp-suppressions.xml using mechanical Python linter.
  #   Blocks CI if any suppression lacks 'until' date, is expired, exceeds
  #   90 days, or lacks required issue reference / dual reviewer handles.
  #
  # Rate-Limiting & Freshness:
  #   Uses a rolling 24-hour cache key (date +'%Y-%m-%d') so concurrent PRs
  #   share NVD feed updates within the day, avoiding NVD free-tier 403/429
  #   rate limiting. Daily rollover guarantees fresh CVE definitions every day
  #   (including the Monday weekly scan).
  #   Accepts secrets.NVD_API_KEY if configured to increase NVD throughput.
  # -----------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python for Suppressions Governance Linter
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Mechanically Lint Suppressions Governance Policy
        run: |
          python3 .github/scripts/validate-suppressions.py .github/owasp-suppressions.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Get Current Date Stamp (24h Rolling Window)
        id: cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache NVD CVE Database (24h Rolling Cache)
        uses: actions/cache@v4
        with:
          path: /tmp/nvd-cache
          key: nvd-cache-${{ steps.cache-date.outputs.date }}
          restore-keys: |
            nvd-cache-

      - name: Run OWASP Dependency Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          mkdir -p /tmp/nvd-cache
          API_KEY_ARG=""
          if [ -n "$NVD_API_KEY" ]; then
            echo "[INFO] NVD_API_KEY secret detected; using authenticated NVD feed."
            API_KEY_ARG="-DnvdApiKey=$NVD_API_KEY"
          else
            echo "[WARN] No NVD_API_KEY secret configured; using cached/free-tier feed with 24h rolling cache."
          fi

          mvn -f pom.xml \
            org.owasp:dependency-check-maven:10.0.3:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionsFile=.github/owasp-suppressions.xml \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check-report \
            -DdataDirectory=/tmp/nvd-cache \
            -DautoUpdate=true \
            $API_KEY_ARG \
            -Dfrontend.skip=true \
            --no-transfer-progress \
            -B
        continue-on-error: true

      - name: Upload SCA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report/
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 2: Trivy Container Image Scan (CNAST)
  #
  # OS-level coverage:
  #   vuln-type: os,library covers BOTH:
  #     - OS packages in the base image (eclipse-temurin:21-jre-alpine)
  #       e.g. musl, busybox, libssl, libcrypto installed via apk
  #     - Application library JARs on the classpath
  #
  # Rate-Limiting & Freshness:
  #   Uses a 24-hour rolling cache for Trivy DB (/tmp/trivy-cache). This
  #   prevents hitting GHCR pull rate limits across frequent PR builds while
  #   ensuring daily and Monday scheduled scans pull fresh vulnerability DBs.
  # -----------------------------------------------------------------------
  trivy-container-scan:
    name: CNAST - Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Get Current Date Stamp (24h Rolling Window)
        id: trivy-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Trivy Vulnerability Database (24h Rolling Cache)
        uses: actions/cache@v4
        with:
          path: /tmp/trivy-cache
          key: trivy-cache-${{ steps.trivy-date.outputs.date }}
          restore-keys: |
            trivy-cache-

      - name: Build Docker Image (no push)
        run: |
          mkdir -p /tmp/trivy-cache
          docker build \
            --tag medbuilds-emr:scan-${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Run Trivy - Advisory scan (OS + library, HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medbuilds-emr:scan-${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
          cache-dir: /tmp/trivy-cache

      - name: Run Trivy - Blocking gate (CRITICAL CVEs only, SARIF output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medbuilds-emr:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache-dir: /tmp/trivy-cache
        continue-on-error: true

      - name: Upload Trivy SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-sarif
          path: trivy-results.sarif
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 3: Hadolint Dockerfile Linting
  #
  # Failure threshold:
  #   failure-threshold: error (blocks CI only on genuine syntax/structural errors)
  #   Warnings are advisory to avoid blocking PRs on Alpine-specific style idioms.
  # -----------------------------------------------------------------------
  hadolint-dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          ignore: DL3008,DL3018
          failure-threshold: error
          format: tty
