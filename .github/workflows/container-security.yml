name: Container Security Scan (Trivy + OWASP SCA)

on:
  push:
    branches: [ main, master, "feature/**", "fix/**", "security/**" ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly scan every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: OWASP Dependency Check - Software Composition Analysis (SCA)
  # Scans Maven dependencies for known CVEs via NVD.
  # -----------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run OWASP Dependency Check
        run: |
          mvn -f pom.xml \
            org.owasp:dependency-check-maven:10.0.3:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionsFile=.github/owasp-suppressions.xml \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check-report \
            -Dfrontend.skip=true \
            --no-transfer-progress \
            -B
        continue-on-error: true

      - name: Upload SCA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report/
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 2: Trivy Container Image Scan (CNAST)
  # Builds the Docker image and scans for OS and language-level CVEs.
  # Fails on CRITICAL severity vulnerabilities.
  # -----------------------------------------------------------------------
  trivy-container-scan:
    name: CNAST - Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Docker Image (no push)
        run: |
          docker build \
            --tag medbuilds-emr:scan-${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Run Trivy Vulnerability Scan (Table output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medbuilds-emr:scan-${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Run Trivy Scan (SARIF output for GitHub Security tab)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medbuilds-emr:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          # Block build only on CRITICAL CVEs
          severity: CRITICAL
        continue-on-error: true

      - name: Upload Trivy SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-sarif
          path: trivy-results.sarif
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 3: Hadolint Dockerfile Linting
  # Enforces Dockerfile best practices aligned with CIS Docker Benchmark.
  # -----------------------------------------------------------------------
  hadolint-dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: pin apt-get package versions - acceptable for Alpine apk
          # DL3018: pin apk package versions - relax for build-stage only
          ignore: DL3008,DL3018
          failure-threshold: warning
