name: Container Security Scan (Trivy + OWASP SCA)

on:
  push:
    branches: [ main, master, "feature/**", "fix/**", "security/**" ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Weekly scan every Monday at 02:00 UTC
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: OWASP Dependency Check - Software Composition Analysis (SCA)
  #
  # CVE database freshness:
  #   On scheduled runs the Maven local cache (~/.m2) is NOT restored, so the
  #   OWASP NVD data-feed cache that lives inside ~/.m2 is always cold on
  #   cron triggers. On PR/push runs the maven cache IS restored (cache: maven)
  #   which may carry a stale NVD cache. We force a fresh pull on both paths
  #   by passing -DautoUpdate=true (enabled by default) and setting
  #   -DdataDirectory to a job-scoped temp path that is never cached, ensuring
  #   the NVD feed is re-downloaded on every run regardless of trigger type.
  # -----------------------------------------------------------------------
  sca-dependency-check:
    name: SCA - OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Deliberately NOT restoring the Maven cache here so the NVD data
          # directory inside ~/.m2 is always empty and the plugin fetches fresh
          # CVE data from NVD on every run.

      - name: Run OWASP Dependency Check (fresh NVD fetch)
        run: |
          # Use a job-local, non-cached directory for the NVD database.
          # This guarantees a fresh CVE feed download on every CI trigger
          # (both scheduled and push/PR) and prevents stale data from
          # being silently reused from a restored Maven cache.
          mvn -f pom.xml \
            org.owasp:dependency-check-maven:10.0.3:check \
            -DfailBuildOnCVSS=9 \
            -DsuppressionsFile=.github/owasp-suppressions.xml \
            -Dformat=HTML \
            -DoutputDirectory=target/dependency-check-report \
            -DdataDirectory=/tmp/nvd-cache-${{ github.run_id }} \
            -DautoUpdate=true \
            -Dfrontend.skip=true \
            --no-transfer-progress \
            -B
        continue-on-error: true

      - name: Upload SCA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: target/dependency-check-report/
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 2: Trivy Container Image Scan (CNAST)
  #
  # OS-level coverage:
  #   vuln-type: os,library covers BOTH:
  #     - OS packages installed in the base image (eclipse-temurin:21-jre-alpine)
  #       e.g. musl, busybox, libssl, libcrypto installed by Alpine's apk
  #     - Application library JARs on the classpath (Spring, HAPI FHIR, etc.)
  #   The scan runs against the final runtime image, not the builder stage,
  #   so only what ships to production is evaluated.
  #
  # CVE database freshness:
  #   Trivy downloads its vulnerability database to /tmp/trivy-db-$RUN_ID,
  #   a unique path that is never cached between runs. This forces a fresh
  #   database pull on every trigger including scheduled weekly scans.
  #
  # Gate policy:
  #   Table scan:  report HIGH and CRITICAL, exit 0 (advisory only).
  #   SARIF scan:  report CRITICAL only, exit 1 (blocking gate).
  #   ignore-unfixed: true — CVEs with no available fix are excluded from
  #   the blocking gate to avoid noise on Alpine rolling packages.
  # -----------------------------------------------------------------------
  trivy-container-scan:
    name: CNAST - Trivy Container Vulnerability Scan
    runs-on: ubuntu-latest
    env:
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Build Docker Image (no push)
        run: |
          docker build \
            --tag medbuilds-emr:scan-${{ github.sha }} \
            --file Dockerfile \
            .

      - name: Run Trivy - Advisory scan (OS + library, HIGH and CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medbuilds-emr:scan-${{ github.sha }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          # os: Alpine OS packages (musl, libssl, etc.)
          # library: JVM classpath JARs
          vuln-type: os,library
          severity: CRITICAL,HIGH
          # Use a unique cache dir per run so the vuln DB is always fresh.
          # Stale Trivy DB on a scheduled scan would miss CVEs published
          # since the last cache write.
          cache-dir: /tmp/trivy-cache-${{ github.run_id }}

      - name: Run Trivy - Blocking gate (CRITICAL CVEs only, SARIF output)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: medbuilds-emr:scan-${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL
          cache-dir: /tmp/trivy-cache-${{ github.run_id }}
        continue-on-error: true

      - name: Upload Trivy SARIF Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-scan-sarif
          path: trivy-results.sarif
          retention-days: 30

  # -----------------------------------------------------------------------
  # Job 3: Hadolint Dockerfile Linting
  #
  # Failure threshold rationale:
  #   failure-threshold: error  (blocks CI only on true errors)
  #   Warnings are reported but do not block the build.
  #
  #   Rationale: The base image (eclipse-temurin:21-jre-alpine) uses Alpine
  #   Linux with apk, not apt-get. DL3008/DL3018 are ignored (apk variant).
  #   Remaining Hadolint warnings on Alpine Dockerfiles are style suggestions
  #   (e.g. COPY preferred over ADD) that are useful to surface but should not
  #   block PRs — developers addressing a clinical feature should not have CI
  #   fail on advisory Dockerfile style notes. Genuine errors (e.g. missing
  #   FROM, invalid instruction syntax) remain blocking.
  #
  #   If the team decides to enforce warnings as errors, change to:
  #     failure-threshold: warning
  #   and document the decision here.
  # -----------------------------------------------------------------------
  hadolint-dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008: pin apt-get versions  - N/A, Alpine uses apk not apt-get
          # DL3018: pin apk versions      - Relaxed for build-stage base image
          ignore: DL3008,DL3018
          # Block CI only on genuine errors; warnings are advisory.
          failure-threshold: error
          # Output format includes line number and rule ID for traceability.
          format: tty
