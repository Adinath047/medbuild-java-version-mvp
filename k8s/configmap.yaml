apiVersion: v1
kind: ConfigMap
metadata:
  name: medicos-config
  namespace: default
  labels:
    app: medicos-backend
data:
  SPRING_APPLICATION_NAME: "medbuild"
  PORT: "8080"
  SPRING_CACHE_TYPE: "redis"
  REDIS_HOST: "localhost"
  REDIS_PORT: "6379"
  EMBEDDED_REDIS_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:3000,http://localhost:4000,http://127.0.0.1:5173"
